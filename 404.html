<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Bingi Jayanth</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            position: relative;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }
        
        .error-message {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--text-color);
        }
        
        .error-description {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
            color: var(--text-color-secondary);
        }
        
        .home-btn {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="matrix-background">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="error-container">
        <div class="glitch-wrapper">
            <h1 class="error-code glitch" data-text="404">404</h1>
        </div>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn primary-btn home-btn">Back to Home</a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
